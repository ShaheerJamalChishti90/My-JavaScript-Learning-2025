<!DOCTYPE html>
<html>
<head>
  <title>getElementById Example</title>
</head>
<body>
  <h1 id="title">Hello!</h1>

  <script>
    // Find the element with ID "title"
    let heading = document.getElementById("title");

    // Change its text
    heading.innerHTML = "Hi, I’m Shaheer!";
  </script>
</body>
</html>
