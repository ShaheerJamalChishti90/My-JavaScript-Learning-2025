<!DOCTYPE html>
<html>
<head>
  <title>querySelector Example</title>
</head>
<body>
  <p class="message">Hello World</p>
  <p class="message">Second Message</p>

  <script>
    // Find the first element with class "message"
    let msg = document.querySelector(".message");

    // Change its text
    msg.innerHTML = "Changed by querySelector!";
  </script>
</body>
</html>
