<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express.js Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/20zB+J0+tF5yV2u8gA4u5d9qJ1z55uK9vEw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-lg w-full max-w-xl flex flex-col h-[80vh]">
        
        <div class="bg-indigo-600 text-white p-4 rounded-t-2xl flex items-center justify-between">
            <div class="flex items-center">
                <i class="fa-solid fa-robot text-2xl mr-3"></i>
                <h1 class="text-xl font-bold">Express.js Chatbot</h1>
            </div>
        </div>

        <div id="chat-container" class="flex-1 p-6 overflow-y-auto space-y-4">
            <div class="flex items-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-xl rounded-bl-none max-w-xs shadow-md">
                    <p>Hello! Ask me a question about Express.js or Node.js.</p>
                </div>
            </div>
            <div id="suggested-questions" class="flex flex-wrap gap-2 mt-4 justify-start">
                </div>
        </div>

        <div class="bg-gray-100 p-4 border-t border-gray-200 rounded-b-2xl">
            <form id="chat-form" class="flex items-center">
                <input type="text" id="user-input" placeholder="Type your message..." class="flex-1 p-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="ml-2 bg-indigo-600 text-white p-3 rounded-full hover:bg-indigo-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatForm = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const suggestedQuestionsContainer = document.getElementById('suggested-questions');
            const hardcodedQuestions = [
                "What is Express.js?",
                "How are you?",
                "What is Node.js?",
                "What is a GET request?",
                "What is a POST request?"
            ];

            // Function to add a message to the chat container
            function appendMessage(text, sender) {
                const messageDiv = document.createElement('div');
                if (sender === 'user') {
                    messageDiv.classList.add('flex', 'justify-end');
                    messageDiv.innerHTML = `<div class="bg-indigo-600 text-white p-3 rounded-xl rounded-br-none max-w-xs shadow-md"><p>${text}</p></div>`;
                } else {
                    messageDiv.classList.add('flex', 'items-start');
                    messageDiv.innerHTML = `<div class="bg-gray-200 text-gray-800 p-3 rounded-xl rounded-bl-none max-w-xs shadow-md"><p>${text}</p></div>`;
                }
                chatContainer.appendChild(messageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            // Function to add the suggested question buttons
            function addSuggestedQuestions() {
                suggestedQuestionsContainer.innerHTML = ''; // Clear previous questions
                hardcodedQuestions.forEach(question => {
                    const button = document.createElement('button');
                    button.textContent = question;
                    button.classList.add('bg-gray-200', 'text-gray-800', 'text-sm', 'px-4', 'py-2', 'rounded-full', 'hover:bg-gray-300', 'transition-colors', 'duration-200');
                    button.addEventListener('click', () => {
                        handleQuestion(question);
                    });
                    suggestedQuestionsContainer.appendChild(button);
                });
            }

            // Function to handle the question submission (from form or button click)
            async function handleQuestion(question) {
                // Add user message to the chat
                appendMessage(question, 'user');

                // Clear the input and hide suggested questions
                userInput.value = '';
                suggestedQuestionsContainer.style.display = 'none';

                // Simulate "typing" indicator
                const typingIndicator = document.createElement('div');
                typingIndicator.innerHTML = `
                    <div class="flex items-start">
                        <div class="bg-gray-200 text-gray-800 p-3 rounded-xl rounded-bl-none max-w-xs shadow-md">
                            <span class="typing-indicator">...</span>
                        </div>
                    </div>
                `;
                chatContainer.appendChild(typingIndicator);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                try {
                    // Send the user's question to the server
                    const response = await fetch('/ask', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ question: question }),
                    });

                    const data = await response.json();
                    
                    // Remove the typing indicator
                    typingIndicator.remove();
                    
                    // Add bot message to the chat
                    appendMessage(data.answer, 'bot');
                    
                    // Show new suggested questions after the bot responds
                    addSuggestedQuestions();
                    suggestedQuestionsContainer.style.display = 'flex';

                } catch (error) {
                    console.error('Error:', error);
                    typingIndicator.remove();
                    appendMessage("Sorry, I'm having trouble connecting to the server.", 'bot');
                }
            }

            // Handle form submission (for when the user types a question)
            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const question = userInput.value.trim();
                if (question) {
                    handleQuestion(question);
                }
            });

            // Initial call to display the questions when the page loads
            addSuggestedQuestions();
        });
    </script>
</body>
</html>
